name = "spotify-sync"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Production: `npx wrangler deploy`
# ---------------------------------------------------------------------------

# Crons fire internally; the only HTTP route is POST /sync-full (secret-protected).
# Kept off (Amendment A3). For a repair run: set SYNC_FULL_SECRET, flip to true,
# deploy, call it, flip back.
workers_dev = false
preview_urls = false

[triggers]
# UTC, same times the Python server used.
crons = ["* * * * *", "0 3 * * *", "0 4 * * *"]  # TEMP: restore "*/10 * * * *"

# Local `wrangler dev` and vitest use a local simulated DB for this binding;
# only `wrangler deploy` reaches the real production database.
[[d1_databases]]
binding = "DB"
database_name = "spotify-automation"
database_id = "YOUR_PREVIOUS_D1_DATABASE_ID"

[vars]
WRITE_MODE = "live"
# Only the sync cursor key namespace; nothing is written to this playlist.
SPOTIFY_ALL_PLAYLIST_ID = "YOUR_ALL_PLAYLIST_ID"
SPOTIFY_FREQUENT_PLAYLIST_ID = "YOUR_FREQUENT_PLAYLIST_ID"
FREQUENT_MIN_PLAYS = "5"
SPOTIFY_HINDI_FAVORITES_PLAYLIST_ID = "YOUR_HINDI_PLAYLIST_ID"

# Secrets (`wrangler secret put <NAME>`; locally in .dev.vars):
#   SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SYNC_FULL_SECRET (only for /sync-full)

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Test: `npx wrangler dev --env test --test-scheduled`, then
#   curl "http://localhost:8787/__scheduled?cron=*/10+*+*+*+*"
# Runs locally in dry_run against the remote test D1 (real Spotify reads, no writes).
# ---------------------------------------------------------------------------
[env.test]
name = "spotify-automation-test"
workers_dev = false

[[env.test.d1_databases]]
binding = "DB"
database_name = "spotify-automation-test"
database_id = "YOUR_TEST_D1_DATABASE_ID"
remote = true

[env.test.vars]
WRITE_MODE = "dry_run"
SPOTIFY_ALL_PLAYLIST_ID = "YOUR_ALL_PLAYLIST_ID"
SPOTIFY_FREQUENT_PLAYLIST_ID = "YOUR_FREQUENT_PLAYLIST_ID"
FREQUENT_MIN_PLAYS = "5"
SPOTIFY_HINDI_FAVORITES_PLAYLIST_ID = "YOUR_HINDI_PLAYLIST_ID"
