# ──────────────────────────────────────────────────
# Spotify Automation – default configuration
# ──────────────────────────────────────────────────
# Every value here can be overridden by setting the
# corresponding environment variable (see comments).
# Secrets (client_id, client_secret, redirect_uri,
# playlist IDs) must be set as environment variables
# or in a .env file – they are NOT stored here.

db:
  # env: DB_PATH
  path: data/spotify.db

spotify:
  # env: SPOTIFY_SCOPE
  scope: "user-read-recently-played playlist-modify-private user-library-modify user-library-read"
  # env: SPOTIFY_TOKEN_CACHE_PATH
  cache_path: data/.spotify_token_cache.json
  # env: FREQUENT_MIN_PLAYS
  frequent_min_plays: 2
  # env: LIKE_BATCH_SIZE
  like_batch_size: 50

logging:
  # env: LOG_LEVEL
  level: INFO
  # env: LOG_FILE
  file: data/logs/spotify.log
  # env: LOG_RETENTION_DAYS
  retention_days: 7

general:
  # env: BOOTSTRAP_HOURS
  bootstrap_hours: 24
  # env: RECENTLY_PLAYED_LIMIT  (capped at 50 by the Spotify API)
  recently_played_limit: 50
  # env: PLAYLIST_ADD_BATCH_SIZE
  add_batch_size: 100
  # env: LIKE_BATCH_SIZE
  like_batch_size: 50
  # env: CACHE_REFRESH_HOURS
  cache_refresh_hours: 24

# Artist Discovery Thresholds
# An artist qualifies for an auto-generated playlist if ANY of:
#   - songs_over_threshold songs have >= plays_per_song_threshold plays
#   - total streams > total_streams_threshold
#   - song_count > alt_song_count AND total streams > alt_streams_threshold
artist_discovery:
  # env: ARTIST_PLAYS_PER_SONG_THRESHOLD
  plays_per_song_threshold: 20
  # env: ARTIST_SONGS_OVER_THRESHOLD
  songs_over_threshold: 15
  # env: ARTIST_TOTAL_STREAMS_THRESHOLD
  total_streams_threshold: 1500
  # env: ARTIST_ALT_SONG_COUNT
  alt_song_count: 60
  # env: ARTIST_ALT_STREAMS_THRESHOLD
  alt_streams_threshold: 500
  # env: ARTIST_MIN_PLAYS_PER_TRACK
  min_plays_per_track: 30
  # env: ARTIST_MAX_TRACKS_PER_PLAYLIST
  max_tracks_per_playlist: 50
  # env: ARTIST_MIN_TRACKS_PER_PLAYLIST
  # Playlists with fewer qualifying tracks than this are removed from Spotify
  min_tracks_per_playlist: 10

yearly:
  # env: YEARLY_MAX_TRACKS
  max_tracks: 100
