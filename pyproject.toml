[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "spotify-automation"
version = "0.1.0"
description = "Spotify automation + local analytics DB"
authors = ["Sam Singh <owner@example.com>"]
readme = "README.md"
packages = [{ include = "src" }]
include = [
    { path = "src/db/sql/*.sql" },
    { path = "src/config/config.yaml" }
]

[tool.poetry.scripts]
spotify = "src.main:main"
token = "src.token_cli:main"

[tool.poetry.dependencies]
python = "^3.12"
spotipy = "^2.25.2"
python-dotenv = "^1.2.1"
requests = "^2.32.3"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
types-requests = "^2.32.0"

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: integration tests requiring multiple modules",
]
